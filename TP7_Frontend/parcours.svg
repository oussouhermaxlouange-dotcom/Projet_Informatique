<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1915"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <!-- Couloirs -->
  <rect x="40" y="16" width="420" height="430" rx="8" fill="#f5f3ec" stroke="#bdb7a7"/>
  <rect x="540" y="16" width="420" height="430" rx="8" fill="#f5f3ec" stroke="#bdb7a7"/>

  <text x="60" y="46" font-size="16" font-weight="bold" fill="#1a1915">Étudiante</text>
  <text x="560" y="46" font-size="16" font-weight="bold" fill="#1a1915">Responsable pédagogique</text>

  <!-- Écrans : étudiante -->
  <g fill="#ffffff" stroke="#1a1915" stroke-width="1.4">
    <rect x="90" y="92" width="320" height="58" rx="6"/>
    <rect x="90" y="172" width="320" height="58" rx="6"/>
    <rect x="90" y="252" width="320" height="58" rx="6"/>
    <rect x="90" y="332" width="320" height="58" rx="6"/>
  </g>
  <g fill="#1a1915" font-size="13.5" font-weight="bold">
    <text x="106" y="116">1. Connexion</text>
    <text x="106" y="196">2. Mes demandes</text>
    <text x="106" y="276">3. Nouvelle convention</text>
    <text x="106" y="356">4. Détail de la convention</text>
  </g>
  <g fill="#4a4840" font-size="11.5">
    <text x="106" y="136">e-mail, mot de passe, rôle</text>
    <text x="106" y="216">compteurs, tableau, statut</text>
    <text x="106" y="296">entreprise, intitulé, dates</text>
    <text x="106" y="376">statut, date de décision, motif</text>
  </g>

  <!-- Écrans : responsable -->
  <g fill="#ffffff" stroke="#1a1915" stroke-width="1.4">
    <rect x="590" y="92" width="320" height="58" rx="6"/>
    <rect x="590" y="172" width="320" height="58" rx="6"/>
    <rect x="590" y="252" width="320" height="58" rx="6"/>
    <rect x="590" y="332" width="320" height="58" rx="6"/>
  </g>
  <g fill="#1a1915" font-size="13.5" font-weight="bold">
    <text x="606" y="116">1. Connexion</text>
    <text x="606" y="196">2. Dossiers à traiter</text>
    <text x="606" y="276">3. Décision de convention</text>
    <text x="606" y="356">4. Détail de la convention</text>
  </g>
  <g fill="#4a4840" font-size="11.5">
    <text x="606" y="136">e-mail, mot de passe, rôle</text>
    <text x="606" y="216">recherche, filtres, cartes</text>
    <text x="606" y="296">résumé, motif, valider / refuser</text>
    <text x="606" y="376">dossier, décision conservée</text>
  </g>

  <!-- Flèches verticales : parcours normal -->
  <g stroke="#1a1915" stroke-width="1.5" fill="none" marker-end="url(#fleche)">
    <line x1="250" y1="150" x2="250" y2="168"/>
    <line x1="250" y1="230" x2="250" y2="248"/>
    <line x1="250" y1="310" x2="250" y2="328"/>
    <line x1="750" y1="150" x2="750" y2="168"/>
    <line x1="750" y1="230" x2="750" y2="248"/>
    <line x1="750" y1="310" x2="750" y2="328"/>
  </g>

  <!-- Échange entre les deux rôles -->
  <path d="M 412 281 C 500 281, 500 201, 586 201" stroke="#1a1915" stroke-width="2" fill="none" marker-end="url(#fleche)"/>
  <text x="500" y="246" text-anchor="middle" font-size="11.5" fill="#1a1915">convention SOUMISE</text>

  <path d="M 588 281 C 500 281, 500 361, 414 361" stroke="#1a1915" stroke-width="2" fill="none" marker-end="url(#fleche)"/>
  <text x="500" y="326" text-anchor="middle" font-size="11.5" fill="#1a1915">décision + motif</text>

  <!-- Rappel des erreurs -->
  <rect x="60" y="402" width="880" height="28" rx="5" fill="#ffffff" stroke="#1a1915" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="72" y="420" font-size="11.5" fill="#1a1915">Erreurs lisibles : 400 · 401 · 403 · 404 · 405 · 409 · 422 · 500 · 503 — message sous le champ, retour à la connexion sur 401</text>

  <!-- Légende -->
  <line x1="60" y1="466" x2="104" y2="466" stroke="#1a1915" stroke-width="1.4"/>
  <text x="112" y="470" font-size="11.5" fill="#4a4840">écran ou action</text>
  <line x1="250" y1="466" x2="294" y2="466" stroke="#1a1915" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="302" y="470" font-size="11.5" fill="#4a4840">rappel des erreurs de l’API</text>
  <text x="940" y="470" text-anchor="end" font-size="11.5" fill="#4a4840">flèche pleine : parcours normal</text>
</svg>
