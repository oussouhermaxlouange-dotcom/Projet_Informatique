<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><rect x="0" y="0" width="1280" height="820" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#111" stroke-width="2"/></marker></defs><text x="665" y="22" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Plateforme de suivi des conventions de stage et des soutenances</text><rect x="180" y="40" width="970" height="740" fill="none" stroke="#111" stroke-width="2"/>

